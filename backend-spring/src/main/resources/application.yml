server:
  port: ${SERVER_PORT:5000}
  servlet:
    context-path: /api

spring:
  application:
    name: medixoffice-backend

  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medixoffice}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # Schema already exists and is owned by the Node/Sequelize app during the
      # migration window - never let Hibernate create/alter it. validate makes
      # every entity mapping get checked against the real tables on startup.
      ddl-auto: validate
      naming:
        # Preserves @Table/@Column names exactly as written (no camelCase ->
        # snake_case conversion, no pluralization). Required because the schema
        # mixes camelCase columns (firstName) with snake_case ones (user_id on
        # notifications), and Spring's default strategy would mangle both.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        jdbc:
          time_zone: ${DB_TIMEZONE:UTC}

  mail:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USER}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 600MB
      max-request-size: 600MB

app:
  jwt:
    # HS256 requires >= 256 bits (32 chars). jjwt enforces this strictly, unlike
    # the Node jsonwebtoken lib - the old 'your-secret-key' fallback would be
    # rejected outright. No default here: fail fast at startup if unset.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:2592000000} # 30 days, matches the Node token expiry
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  url: ${APP_URL:http://localhost:5173}
  uploads:
    medical-files-dir: ${MEDICAL_FILES_DIR:./medicalFiles}
  email:
    from: ${EMAIL_FROM:${EMAIL_USER}}
  seed-data:
    # Off by default so it never runs against a real/deployed DB by accident.
    # Enable locally with SEED_DATA_ENABLED=true when you want a fresh demo dataset.
    enabled: ${SEED_DATA_ENABLED:false}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  public-key: ${STRIPE_PUBLIC_KEY:}

paypal:
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
  base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
